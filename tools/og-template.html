<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG-картинка · шаблон 1200×630</title>
<!-- Шаблон превью для мессенджеров и соцсетей. Открыть через локальный сервер из корня сайта,
     окно 1200×630, снять скриншот в images/og-cover.jpg. Использует стили и вьюер сайта. -->
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  html { overflow: hidden; }
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 520px; gap: 40px; padding: 56px 60px; box-sizing: border-box; }
  .og__text { display: flex; flex-direction: column; justify-content: center; gap: 20px; min-width: 0; }
  .og .brand { font-size: 26px; }
  .og .brand__logo { width: 40px; height: 40px; }
  .og h1 { font-size: 46px; line-height: 1.1; margin: 4px 0 0; letter-spacing: -.02em; }
  .og__text p { font-size: 20px; color: var(--ink-2); margin: 0; max-width: 24ch; }
  .og .kpi { margin-top: 6px; }
  .og .kpi div { font-size: 14px; }
  .og .hero-visual { padding: 14px; align-self: center; }
  .og .viewer { height: 470px; }
  .og__frame { position: absolute; inset: 20px; border: 1px solid var(--line-strong); pointer-events: none; }
  .og__stamp { position: absolute; right: 60px; bottom: 26px; font: 500 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="og">
  <div class="og__frame" aria-hidden="true"></div>
  <div class="og__text">
    <a class="brand" href="#"><img class="brand__logo" src="/assets/img/logo-techdraft.svg" alt=""> VovrenyukTechDraft</a>
    <h1>3D-модели и чертежи по ЕСКД</h1>
    <p>Ведущий инженер-конструктор, опыт в отрасли более 15 лет. От ТЗ до опытного образца.</p>
    <div class="kpi"><div>3D &gt; DXF / STEP / STL</div><div>Спецификации</div><div>ПС, РЭ, ЗИП</div></div>
  </div>
  <div class="hero-visual">
    <div id="modelWrap" class="viewer is-draw">
      <span class="viewer-caption" aria-hidden="true">Интерактивная 3D-модель</span>
      <canvas id="modelCanvas"></canvas>
      <p id="viewerDims" class="viewer-dims" hidden></p>
    </div>
  </div>
  <div class="og__stamp">vovrenyuk.ru · Лист 1 · Формат A4</div>
</div>
<script type="module">
  import { initViewer } from "/assets/js/viewer.bundle.js";
  const api = initViewer({ model: fetch("/models/model.glb") });
  const wrap = document.getElementById("modelWrap");
  const t = setInterval(() => {
    if (!wrap.classList.contains("is-ready")) return;
    clearInterval(t);
    api.setMode("draw");
    api.setView("iso");
    setTimeout(() => document.body.classList.add("og-ready"), 500);
  }, 100);
</script>
</body>
</html>
